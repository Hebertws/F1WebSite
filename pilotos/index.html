<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilotos · F1 Start Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../estilo/styles.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="../assets/Logo.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="../index.html#inicio" aria-label="F1 Start Dashboard">
        <img class="brand-mark" src="../assets/Logo.svg" alt="" width="78" height="58" />
      </a>
      <button class="nav-toggle" id="mobile-nav-toggle" type="button" aria-controls="main-navigation" aria-expanded="false" aria-label="Abrir navegação">
        <i data-lucide="menu"></i>
      </button>
      <nav class="main-nav" id="main-navigation" aria-label="Navegação principal">
        <a href="../index.html#dashboard">Dashboard</a>
        <a href="../index.html#conhecendo">Conhecendo F1</a>
        <a href="index.html" aria-current="page">Pilotos</a>
        <a href="../index.html#calendario">Calendário</a>
      </nav>
    </header>

    <main>
      <section class="pg-hero">
        <span class="eyebrow">Grid 2026</span>
        <h1>Pilotos</h1>
        <p>
          Quem são, de onde vieram e o que cada um mostra na pista. Toque em um
          piloto para ler a história completa.
        </p>
        <dl class="pg-hero-stats" id="hero-stats"></dl>
      </section>

      <section class="section pilots-section">
        <div class="toolbar">
          <div class="glossary-search-field pilot-search">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="pilot-search" type="search" placeholder="Buscar piloto, país ou equipe" autocomplete="off" aria-label="Buscar piloto" />
          </div>
          <div class="team-filters" id="team-filters" role="group" aria-label="Filtrar por equipe"></div>
        </div>
        <p class="pilot-count" id="pilot-count" aria-live="polite"></p>
        <div class="pilot-grid" id="pilot-grid"></div>
      </section>
    </main>

    <footer class="site-footer">
      <span>F1 Start Dashboard</span>
      <span>Pontos e vitórias via Jolpica F1.</span>
    </footer>

    <div class="pilot-modal-overlay" id="pilot-modal-overlay" hidden>
      <div class="pilot-modal" id="pilot-modal" role="dialog" aria-modal="true" aria-labelledby="pm-name"></div>
    </div>

    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
